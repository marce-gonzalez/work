<!doctype html><meta charset="utf-8"><title>Pruebas CO2Serial</title>
<pre id="result">Ejecutando…</pre>
<script type="module">
import {CO2Serial, parseMessage, validThresholds} from '../web/co2.mjs';
const result = document.querySelector('#result');
const telemetry = {schema_version:2,type:'telemetry',seq:1,uptime_ms:60000,co2_ppm:700,
  sensor_status:'ok',pump_command:'on',control_mode:'automatic',control_enabled:true,
  threshold_on_ppm:700,threshold_off_ppm:650};
const checks = [];
const check = (condition, name) => { if (!condition) throw new Error(name); checks.push(name); };

function fakePort() {
  let controller;
  const readable = new ReadableStream({start(c){controller=c;}});
  const writable = new WritableStream({write(bytes){
    const command = JSON.parse(new TextDecoder().decode(bytes));
    if (command.on_ppm === 900) return; // Simula ausencia de ack.
    const accepted = command.on_ppm !== 800;
    const ack = accepted
      ? {schema_version:2,type:'ack',command:'set_thresholds',accepted:true,threshold_on_ppm:command.on_ppm,threshold_off_ppm:command.off_ppm,saved:command.save}
      : {schema_version:2,type:'ack',command:'set_thresholds',accepted:false,error:'threshold_gap_too_small'};
    controller.enqueue(new TextEncoder().encode(JSON.stringify(ack)+'\n'));
  }});
  return {readable,writable,async open(){},async close(){}};
}

try {
  check(parseMessage(JSON.stringify(telemetry)).co2_ppm === 700, 'telemetría v2');
  check(validThresholds(700,650) && !validThresholds(700,690), 'validación de umbrales');
  let invalid = false; try { parseMessage('{"schema_version":1}'); } catch { invalid = true; }
  check(invalid, 'rechazo de contrato anterior');
  const port = fakePort();
  Object.defineProperty(navigator,'serial',{configurable:true,value:{requestPort:async()=>port}});
  const device = new CO2Serial();
  await device.connect();
  const accepted = await device.setThresholds(700,650,true);
  check(accepted.accepted && accepted.saved, 'ack aceptado');
  let rejected = false; try { await device.setThresholds(800,750,true); } catch (error) { rejected=error.code==='threshold_gap_too_small'; }
  check(rejected, 'ack rechazado');
  let timedOut = false; try { await device.setThresholds(900,650,true); } catch (error) { timedOut=error.message.includes('Tiempo de espera'); }
  check(timedOut, 'timeout sin ack');
  await device.disconnect();
  const secondPort = fakePort();
  Object.defineProperty(navigator,'serial',{configurable:true,value:{requestPort:async()=>secondPort}});
  const secondDevice = new CO2Serial();
  await secondDevice.connect();
  const pending = secondDevice.setThresholds(900,650,true).then(()=>false,()=>true);
  await new Promise(resolve=>setTimeout(resolve,20));
  await secondDevice.disconnect();
  check(await pending, 'desconexión rechaza ack pendiente');
  result.textContent = `PASS · ${checks.length} comprobaciones\n${checks.join('\n')}`;
  result.style.color = 'green'; document.title = 'PASS';
} catch (error) {
  result.textContent = `FAIL · ${error.stack}`; result.style.color='red'; document.title='FAIL';
}
</script>
